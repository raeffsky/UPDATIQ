plugins { id 'com.android.application' }

dependencies { implementation 'androidx.core:core:1.13.1' }

android {
    namespace 'com.updatiq.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.updatiq.app'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('UPDATIQ_KEYSTORE_FILE') ?: 'release-keystore.jks')
            storePassword System.getenv('UPDATIQ_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('UPDATIQ_KEY_ALIAS') ?: ''
            keyPassword System.getenv('UPDATIQ_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
