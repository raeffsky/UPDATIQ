name: Sync MLBB Nexus tier lists
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-mlbbnexus-tiers
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch lane-specific tier lists
        run: python scripts/sync_mlbbnexus.py
      - name: Commit updated tier data
        run: |
          if git diff --quiet -- mlbbnexus-tiers.json; then
            echo "Tier data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mlbbnexus-tiers.json
          git commit -m "chore: sync MLBB Nexus lane tier data"
          git push
