name: Build UPDATIQ APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image optimizer
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Fetch and optimize MLBB hero portraits and skills
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/warungerik/MLBB-Hero-Scraper.git /tmp/mlbb-hero-scraper
          node /tmp/mlbb-hero-scraper/scraper.js
          mkdir -p app/src/main/assets/hero-images/skills
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const root = '/tmp/mlbb-hero-scraper/heroes';
          const out = 'app/src/main/assets/hero-images';
          const names = fs.readdirSync(root).filter(name => fs.statSync(path.join(root, name)).isDirectory());
          const result = {};
          for (const name of names) {
            const dir = path.join(root, name);
            const jsonPath = path.join(dir, 'json.txt');
            if (!fs.existsSync(jsonPath)) continue;
            const hero = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
            const heroOut = path.join(out, 'skills', name);
            fs.mkdirSync(heroOut, { recursive: true });
            const skills = [];
            for (let i = 0; i < (hero.skills || []).length; i++) {
              const skill = hero.skills[i];
              const src = path.join(dir, skill.icon_file || '');
              let icon = '';
              if (skill.icon_file && fs.existsSync(src)) {
                const file = 'skill_' + (i + 1) + '.webp';
                const dest = path.join(heroOut, file);
                execFileSync('cwebp', ['-quiet', '-q', '76', '-resize', '128', '128', src, '-o', dest]);
                icon = 'hero-images/skills/' + name + '/' + file;
              }
              skills.push({
                name: skill.name || ('Skill ' + (i + 1)),
                group: Number(skill.group) || 1,
                description: skill.description_clean || skill.description_raw || 'Описание навыка пока недоступно.',
                icon
              });
            }
            result[name] = skills;
            const heroIcon = path.join(dir, hero.icon_file || 'icon.png');
            if (fs.existsSync(heroIcon)) execFileSync('cwebp', ['-quiet', '-q', '80', '-resize', '256', '0', heroIcon, '-o', path.join(out, name + '.webp')]);
          }
          fs.writeFileSync('app/src/main/assets/hero-skills.js', 'window.heroSkillData = ' + JSON.stringify(result) + ';\n');
          console.log('Generated optimized skill data for ' + Object.keys(result).length + ' heroes');
          NODE
      - name: Optimize brand assets and remove unused image
        run: |
          cwebp -quiet -q 82 -alpha_q 90 app/src/main/assets/UPDATIQ-U-transparent.png -o app/src/main/assets/UPDATIQ-U-transparent.webp
          sed -i 's/UPDATIQ-U-transparent\.png/UPDATIQ-U-transparent.webp/g' app/src/main/assets/index.html
          rm app/src/main/assets/UPDATIQ-U-transparent.png
          rm -f app/src/main/assets/UPDATIQ-App-Icon.jpg
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UPDATIQ-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
