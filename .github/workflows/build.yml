name: Build UPDATIQ APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch current MLBB hero portraits and skills
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/warungerik/MLBB-Hero-Scraper.git /tmp/mlbb-hero-scraper
          node /tmp/mlbb-hero-scraper/scraper.js
          mkdir -p app/src/main/assets/hero-images/skills
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = '/tmp/mlbb-hero-scraper/heroes';
          const out = 'app/src/main/assets/hero-images';
          const names = ['Layla','Fanny','Chou','Kagura','Tigreal','Zilong','Miya','Hayabusa','Estes'];
          const result = {};
          for (const name of names) {
            const dir = path.join(root, name);
            const jsonPath = path.join(dir, 'json.txt');
            if (!fs.existsSync(jsonPath)) continue;
            const hero = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
            const heroOut = path.join(out, 'skills', name);
            fs.mkdirSync(heroOut, { recursive: true });
            const skills = [];
            for (let i = 0; i < (hero.skills || []).length; i++) {
              const skill = hero.skills[i];
              const src = path.join(dir, skill.icon_file || '');
              let icon = '';
              if (skill.icon_file && fs.existsSync(src)) {
                const ext = path.extname(skill.icon_file) || '.png';
                const file = 'skill_' + (i + 1) + ext;
                fs.copyFileSync(src, path.join(heroOut, file));
                icon = 'hero-images/skills/' + name + '/' + file;
              }
              skills.push({
                name: skill.name || ('Skill ' + (i + 1)),
                description: skill.description_clean || skill.description_raw || 'Описание навыка пока недоступно.',
                icon
              });
            }
            result[name] = skills;
            const heroIcon = path.join(dir, hero.icon_file || 'icon.png');
            if (fs.existsSync(heroIcon)) fs.copyFileSync(heroIcon, path.join(out, name + '.png'));
          }
          fs.writeFileSync('app/src/main/assets/hero-skills.js', 'window.heroSkillData = ' + JSON.stringify(result) + ';\\n');
          console.log('Generated skill data for ' + Object.keys(result).length + ' heroes');
          NODE
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UPDATIQ-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
