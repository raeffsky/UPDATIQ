name: Build UPDATIQ APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image optimizer
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Fetch and optimize MLBB hero portraits and skills
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/warungerik/MLBB-Hero-Scraper.git /tmp/mlbb-hero-scraper
          node /tmp/mlbb-hero-scraper/scraper.js
          mkdir -p app/src/main/assets/hero-images/skills
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const root = '/tmp/mlbb-hero-scraper/heroes';
          const out = 'app/src/main/assets/hero-images';
          const names = fs.readdirSync(root).filter(name => fs.statSync(path.join(root, name)).isDirectory());
          const result = {};
          for (const name of names) {
            const dir = path.join(root, name);
            const jsonPath = path.join(dir, 'json.txt');
            if (!fs.existsSync(jsonPath)) continue;
            const hero = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
            const heroOut = path.join(out, 'skills', name);
            fs.mkdirSync(heroOut, { recursive: true });
            const skills = [];
            for (let i = 0; i < (hero.skills || []).length; i++) {
              const skill = hero.skills[i];
              const src = path.join(dir, skill.icon_file || '');
              let icon = '';
              if (skill.icon_file && fs.existsSync(src)) {
                const file = 'skill_' + (i + 1) + '.webp';
                const dest = path.join(heroOut, file);
                execFileSync('cwebp', ['-quiet', '-q', '76', '-resize', '128', '128', src, '-o', dest]);
                icon = 'hero-images/skills/' + name + '/' + file;
              }
              skills.push({
                name: skill.name || ('Skill ' + (i + 1)),
                group: Number(skill.group) || 1,
                description: skill.description_clean || skill.description_raw || 'Описание навыка пока недоступно.',
                icon
              });
            }
            result[name] = skills;
            const heroIcon = path.join(dir, hero.icon_file || 'icon.png');
            if (fs.existsSync(heroIcon)) {
              execFileSync('cwebp', ['-quiet', '-q', '80', '-resize', '256', '0', heroIcon, '-o', path.join(out, name + '.webp')]);
              const slugify = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
              for (const slug of new Set([slugify(name), slugify(hero.name)])) {
                if (slug) execFileSync('cwebp', ['-quiet', '-q', '80', '-resize', '256', '0', heroIcon, '-o', path.join(out, slug + '.webp')]);
              }
            }
          }
          fs.writeFileSync('app/src/main/assets/hero-skills.js', 'window.heroSkillData = ' + JSON.stringify(result) + ';\n');
          console.log('Generated optimized skill data for ' + Object.keys(result).length + ' heroes');
          NODE
      - name: Optimize brand assets and remove unused image
        run: |
          cwebp -quiet -q 82 -alpha_q 90 app/src/main/assets/UPDATIQ-U-transparent.png -o app/src/main/assets/UPDATIQ-U-transparent.webp
          sed -i 's/UPDATIQ-U-transparent\.png/UPDATIQ-U-transparent.webp/g' app/src/main/assets/index.html
          rm app/src/main/assets/UPDATIQ-U-transparent.png
          rm -f app/src/main/assets/UPDATIQ-App-Icon.jpg
      - name: Sync detailed MLBB patch notes
        continue-on-error: true
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 scripts/sync_patch_notes.py
      - name: Embed collected official news and download article images
        run: |
          python3 - <<'PY'
          import hashlib, json, mimetypes, re
          from pathlib import Path
          from urllib.parse import urlparse
          import requests
          data = json.loads(Path("official-news.json").read_text(encoding="utf-8"))
          assets = Path("app/src/main/assets")
          image_dir = assets / "news-images"
          image_dir.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 UPDATIQ/1.0", "Referer": "https://en.moonton.com/"})
          cache = {}
          def localize(url):
              if not isinstance(url, str) or not url.startswith("https://"):
                  return url
              if url in cache:
                  return cache[url]
              digest = hashlib.sha256(url.encode("utf-8")).hexdigest()[:24]
              suffix = Path(urlparse(url).path).suffix.lower()
              if suffix not in (".jpg", ".jpeg", ".png", ".webp", ".gif"):
                  suffix = ".img"
              dest = image_dir / (digest + suffix)
              try:
                  if not dest.exists():
                      response = session.get(url, timeout=20)
                      response.raise_for_status()
                      if not response.headers.get("content-type", "").lower().startswith("image/"):
                          raise ValueError("URL did not return an image")
                      dest.write_bytes(response.content)
                  local = "news-images/" + dest.name
                  cache[url] = local
                  return local
              except Exception as exc:
                  print("Image download failed, retaining remote URL:", url, str(exc))
                  cache[url] = url
                  return url
          for article in data.get("articles", []):
              for key in ("image",):
                  if article.get(key): article[key] = localize(article[key])
              for key in ("images",):
                  if isinstance(article.get(key), list):
                      article[key] = [localize(url) for url in article[key]]
              for block in article.get("contentBlocks", []):
                  if block.get("type") == "image" and block.get("src"):
                      block["src"] = localize(block["src"])
          Path("app/src/main/assets/official-news-data.js").write_text(
              "window.UPDATIQ_OFFICIAL_NEWS = " + json.dumps(data, ensure_ascii=False, separators=(",", ":")) + ";\n",
              encoding="utf-8"
          )
          print("Embedded official articles:", len(data.get("articles", [])), "cached images:", sum(1 for v in cache.values() if v.startswith("news-images/")))
          PY
      - name: Embed MLBB Nexus tier data for offline WebView access
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("mlbbnexus-tiers.json")
          if source.exists():
              data = json.loads(source.read_text(encoding="utf-8"))
              Path("app/src/main/assets/tier-data.js").write_text(
                  "window.UPDATIQ_MLBBNEXUS_TIERS = " + json.dumps(data, ensure_ascii=False, separators=(",", ":")) + ";\n",
                  encoding="utf-8"
              )
              print("Embedded MLBB Nexus lane lists:", {k: v.get("count", 0) for k, v in data.get("lanes", {}).items()})
          else:
              Path("app/src/main/assets/tier-data.js").write_text("window.UPDATIQ_MLBBNEXUS_TIERS = null;\n", encoding="utf-8")
              print("No synced tier data yet; app will show an unavailable-data state.")
          PY
      - name: Embed current hero build data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("mlbb-hero-builds.json")
          data = json.loads(source.read_text(encoding="utf-8")) if source.exists() else {"builds": {}}
          Path("app/src/main/assets/hero-builds.js").write_text(
              "window.UPDATIQ_HERO_BUILDS = " + json.dumps(data, ensure_ascii=False, separators=(",", ":")) + ";\\n",
              encoding="utf-8"
          )
          print("Embedded current hero builds:", len(data.get("builds", {})))
          PY
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>", html, re.S | re.I)
          Path("/tmp/updatiq-inline.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          print("Extracted inline script blocks:", len(scripts))
          PY
          node --check /tmp/updatiq-inline.js
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set monotonically increasing app version
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i "s/versionName '0.1.0'/versionName '0.1.${GITHUB_RUN_NUMBER}'/" app/build.gradle
          grep -E 'versionCode|versionName' app/build.gradle
      - name: Decode persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPDATIQ_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPDATIQ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPDATIQ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPDATIQ_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add UPDATIQ_KEYSTORE_BASE64, UPDATIQ_KEYSTORE_PASSWORD, UPDATIQ_KEY_ALIAS and UPDATIQ_KEY_PASSWORD in GitHub repository Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/updatiq-release.jks"
          echo "UPDATIQ_KEYSTORE_FILE=$RUNNER_TEMP/updatiq-release.jks" >> "$GITHUB_ENV"
      - name: Validate signing key and passwords
        env:
          KEYSTORE_PASSWORD: ${{ secrets.UPDATIQ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPDATIQ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPDATIQ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list -keystore "$UPDATIQ_KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          keytool -list -keystore "$UPDATIQ_KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Keystore and alias validated."
      - name: Build signed release APK
        env:
          UPDATIQ_KEYSTORE_PASSWORD: ${{ secrets.UPDATIQ_KEYSTORE_PASSWORD }}
          UPDATIQ_KEY_ALIAS: ${{ secrets.UPDATIQ_KEY_ALIAS }}
          UPDATIQ_KEY_PASSWORD: ${{ secrets.UPDATIQ_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: UPDATIQ-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare release APK
        run: cp app/build/outputs/apk/release/app-release.apk UPDATIQ.apk
      - name: Publish latest APK for in-app updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest UPDATIQ.apk --clobber
            gh release edit latest --title "UPDATIQ Latest" --notes "Автоматическая актуальная сборка UPDATIQ для встроенного обновления." --latest
          else
            gh release create latest UPDATIQ.apk --title "UPDATIQ Latest" --notes "Автоматическая актуальная сборка UPDATIQ для встроенного обновления."
          fi
