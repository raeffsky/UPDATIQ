name: Build UPDATIQ APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image optimizer
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Fetch and optimize MLBB hero portraits and skills
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/warungerik/MLBB-Hero-Scraper.git /tmp/mlbb-hero-scraper
          node /tmp/mlbb-hero-scraper/scraper.js
          mkdir -p app/src/main/assets/hero-images/skills
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const root = '/tmp/mlbb-hero-scraper/heroes';
          const out = 'app/src/main/assets/hero-images';
          const names = fs.readdirSync(root).filter(name => fs.statSync(path.join(root, name)).isDirectory());
          const result = {};
          for (const name of names) {
            const dir = path.join(root, name);
            const jsonPath = path.join(dir, 'json.txt');
            if (!fs.existsSync(jsonPath)) continue;
            const hero = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
            const heroOut = path.join(out, 'skills', name);
            fs.mkdirSync(heroOut, { recursive: true });
            const skills = [];
            for (let i = 0; i < (hero.skills || []).length; i++) {
              const skill = hero.skills[i];
              const src = path.join(dir, skill.icon_file || '');
              let icon = '';
              if (skill.icon_file && fs.existsSync(src)) {
                const file = 'skill_' + (i + 1) + '.webp';
                const dest = path.join(heroOut, file);
                execFileSync('cwebp', ['-quiet', '-q', '76', '-resize', '128', '128', src, '-o', dest]);
                icon = 'hero-images/skills/' + name + '/' + file;
              }
              skills.push({
                name: skill.name || ('Skill ' + (i + 1)),
                group: Number(skill.group) || 1,
                description: skill.description_clean || skill.description_raw || 'Описание навыка пока недоступно.',
                icon
              });
            }
            result[name] = skills;
            const heroIcon = path.join(dir, hero.icon_file || 'icon.png');
            if (fs.existsSync(heroIcon)) execFileSync('cwebp', ['-quiet', '-q', '80', '-resize', '256', '0', heroIcon, '-o', path.join(out, name + '.webp')]);
          }
          fs.writeFileSync('app/src/main/assets/hero-skills.js', 'window.heroSkillData = ' + JSON.stringify(result) + ';\n');
          console.log('Generated optimized skill data for ' + Object.keys(result).length + ' heroes');
          NODE
      - name: Optimize brand assets and remove unused image
        run: |
          cwebp -quiet -q 82 -alpha_q 90 app/src/main/assets/UPDATIQ-U-transparent.png -o app/src/main/assets/UPDATIQ-U-transparent.webp
          sed -i 's/UPDATIQ-U-transparent\.png/UPDATIQ-U-transparent.webp/g' app/src/main/assets/index.html
          rm app/src/main/assets/UPDATIQ-U-transparent.png
          rm -f app/src/main/assets/UPDATIQ-App-Icon.jpg
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set monotonically increasing app version
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i "s/versionName '0.1.0'/versionName '0.1.${GITHUB_RUN_NUMBER}'/" app/build.gradle
          grep -E 'versionCode|versionName' app/build.gradle
      - name: Decode persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPDATIQ_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPDATIQ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPDATIQ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPDATIQ_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add UPDATIQ_KEYSTORE_BASE64, UPDATIQ_KEYSTORE_PASSWORD, UPDATIQ_KEY_ALIAS and UPDATIQ_KEY_PASSWORD in GitHub repository Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/updatiq-release.jks"
          echo "UPDATIQ_KEYSTORE_FILE=$RUNNER_TEMP/updatiq-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          UPDATIQ_KEYSTORE_PASSWORD: ${{ secrets.UPDATIQ_KEYSTORE_PASSWORD }}
          UPDATIQ_KEY_ALIAS: ${{ secrets.UPDATIQ_KEY_ALIAS }}
          UPDATIQ_KEY_PASSWORD: ${{ secrets.UPDATIQ_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: UPDATIQ-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare release APK
        run: cp app/build/outputs/apk/release/app-release.apk UPDATIQ.apk
      - name: Publish latest APK for in-app updates
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: UPDATIQ Latest
          body: Автоматическая актуальная сборка UPDATIQ для встроенного обновления.
          artifacts: UPDATIQ.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          prerelease: false
