name: Sync official MOONTON news
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-official-news.yml'
permissions:
  contents: write
concurrency:
  group: official-news-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official MOONTON news with retries
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 -A "UPDATIQ-NewsBot/1.0" "https://en.moonton.com/news/index.html" -o /tmp/moonton-news.html
          test -s /tmp/moonton-news.html
          grep -q '/news/[0-9][0-9]*\.html' /tmp/moonton-news.html
      - name: Parse official MOONTON news
        run: |
          python3 - <<'PY'
          import json, re, html
          from datetime import datetime, timezone
          from pathlib import Path
          URL = "https://en.moonton.com/news/index.html"
          page = Path("/tmp/moonton-news.html").read_text(encoding="utf-8", errors="replace")
          # Parse each list item independently; tolerate relative links and markup variations.
          unique = {}
          blocks = re.findall(r"<li\b[^>]*>(.*?)</li>", page, re.S | re.I)
          print("List items found:", len(blocks))
          for block in blocks:
              link = re.search(r"""href=["']([^"']*/news/\d+\.html(?:\?[^"']*)?)["']""", block, re.I)
              if not link:
                  continue
              url = link.group(1)
              if url.startswith("/"):
                  url = "https://en.moonton.com" + url
              elif url.startswith("//"):
                  url = "https:" + url
              elif not url.startswith("http"):
                  url = "https://en.moonton.com/" + url.lstrip("/")
              url = url.split("?", 1)[0]
              def get_text(cls):
                  m = re.search(r"""<div[^>]*class=["'][^"']*(?<![\\w-])""" + re.escape(cls) + r"""(?![\\w-])[^"']*["'][^>]*>(.*?)</div>""", block, re.S | re.I)
                  if not m:
                      return ""
                  value = re.sub(r"<[^>]+>", " ", m.group(1))
                  return " ".join(html.unescape(value).split())
              title = get_text("t")
              if not title:
                  # Fallback: use the first meaningful heading/text block.
                  title = get_text("title") or get_text("news-title")
              if not title:
                  continue
              date = get_text("d")
              summary = get_text("c")
              img = re.search(r"""<img[^>]+(?:src|data-src)=["']([^"']+)["']""", block, re.S | re.I)
              image = img.group(1) if img else ""
              if image.startswith("//"): image = "https:" + image
              elif image.startswith("/"): image = "https://en.moonton.com" + image
              unique[url] = {"id":url.rsplit("/",1)[-1].replace(".html",""),"title":title,"publishedAt":date,"summary":summary,"url":url,"image":image,"source":"MOONTON Games","language":"en","category":"official"}
          articles = sorted(unique.values(), key=lambda a:a.get("publishedAt",""), reverse=True)[:60]
          print("Article links with titles:", len(articles))
          if not articles:
              print("HTML sample:", re.sub(r"\s+", " ", page[:1000]))
              raise SystemExit("No official news extracted; refusing to overwrite last known data.")
          out = {"source":{"name":"MOONTON Games","url":URL,"checkedAt":datetime.now(timezone.utc).isoformat(),"intervalMinutes":30},"articles":articles}
          Path("official-news.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Collected",len(articles),"official articles")
          print("Articles with images:",sum(bool(a["image"]) for a in articles))
          PY
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-news.json
          if git diff --cached --quiet; then echo "No news changes."; exit 0; fi
          git commit -m "Update official MOONTON news feed"
          # API commits or another workflow may update main after checkout.
          # Rebase the generated feed commit onto the latest remote before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
