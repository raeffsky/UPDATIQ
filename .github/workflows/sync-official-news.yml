name: Sync official MOONTON news
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-official-news.yml'
permissions:
  contents: write
concurrency:
  group: official-news-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official MOONTON news with retries
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 -A "UPDATIQ-NewsBot/1.0" "https://en.moonton.com/news/index.html" -o /tmp/moonton-news.html
          test -s /tmp/moonton-news.html
          grep -q '/news/[0-9][0-9]*\.html' /tmp/moonton-news.html
      - name: Parse official MOONTON news
        run: |
          python3 - <<'PY'
          import json, re, html
          from datetime import datetime, timezone
          from pathlib import Path
          URL = "https://en.moonton.com/news/index.html"
          page = Path("/tmp/moonton-news.html").read_text(encoding="utf-8", errors="replace")
          # Parse each list item independently; tolerate relative links and markup variations.
          unique = {}
          blocks = re.findall(r"<li\b[^>]*>(.*?)</li>", page, re.S | re.I)
          print("List items found:", len(blocks))
          for block in blocks:
              link = re.search(r"""href=["']([^"']*/news/\d+\.html(?:\?[^"']*)?)["']""", block, re.I)
              if not link:
                  continue
              url = link.group(1)
              if url.startswith("/"):
                  url = "https://en.moonton.com" + url
              elif url.startswith("//"):
                  url = "https:" + url
              elif not url.startswith("http"):
                  url = "https://en.moonton.com/" + url.lstrip("/")
              url = url.split("?", 1)[0]
              def get_text(cls):
                  m = re.search(r"""<div[^>]*class=["'][^"']*(?<![\w-])""" + re.escape(cls) + r"""(?![\w-])[^"']*["'][^>]*>(.*?)</div>""", block, re.S | re.I)
                  if not m:
                      return ""
                  value = re.sub(r"<[^>]+>", " ", m.group(1))
                  return " ".join(html.unescape(value).split())
              title = get_text("t")
              if not title:
                  # Fallback: use the first meaningful heading/text block.
                  title = get_text("title") or get_text("news-title")
              if not title:
                  continue
              date = get_text("d")
              summary = get_text("c")
              img = re.search(r"""<img[^>]+(?:src|data-src)=["']([^"']+)["']""", block, re.S | re.I)
              image = img.group(1) if img else ""
              if image.startswith("//"): image = "https:" + image
              elif image.startswith("/"): image = "https://en.moonton.com" + image
              unique[url] = {"id":url.rsplit("/",1)[-1].replace(".html",""),"title":title,"publishedAt":date,"summary":summary,"url":url,"image":image,"source":"MOONTON Games","language":"en","category":"official"}
          articles = sorted(unique.values(), key=lambda a:a.get("publishedAt",""), reverse=True)[:40]
          print("Article links with titles:", len(articles))
          if not articles:
              print("HTML sample:", re.sub(r"\s+", " ", page[:1000]))
              raise SystemExit("No official news extracted; refusing to overwrite last known data.")
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import time
          def translate_ru(text):
              text = (text or "").strip()
              if not text: return ""
              try:
                  result = []
                  for offset in range(0, len(text), 2800):
                      query = urlencode({"client":"gtx","sl":"en","tl":"ru","dt":"t","q":text[offset:offset+2800]})
                      req = Request("https://translate.googleapis.com/translate_a/single?" + query, headers={"User-Agent":"Mozilla/5.0 UPDATIQ"})
                      with urlopen(req, timeout=18) as response: payload = json.loads(response.read().decode("utf-8"))
                      result.append("".join(part[0] for part in payload[0] if part and part[0]))
                      time.sleep(0.12)
                  return "".join(result)
              except Exception as exc:
                  print("Translation unavailable:", str(exc)[:120])
                  return text
          def clean_html(fragment):
              fragment = re.sub(r"(?is)<(script|style|noscript)\b.*?</\1>", " ", fragment)
              fragment = re.sub(r"(?i)</p\s*>|<br\s*/?>|</h[1-6]\s*>|</li\s*>", "\n\n", fragment)
              fragment = re.sub(r"(?is)<[^>]+>", " ", fragment)
              fragment = html.unescape(fragment).replace("\xa0", " ")
              return re.sub(r"[ \t]+", " ", re.sub(r"\n[ \t]+", "\n", fragment)).strip()
          for index, article in enumerate(articles):
              article["titleRu"] = translate_ru(article["title"])
              article["summaryRu"] = translate_ru(article.get("summary", ""))
              article["fullText"] = ""
              article["fullTextRu"] = ""
              article["images"] = [article["image"]] if article.get("image") else []
              if index < 30:
                  try:
                      req = Request(article["url"], headers={"User-Agent":"Mozilla/5.0 UPDATIQ-NewsBot/1.0"})
                      with urlopen(req, timeout=22) as response: article_html = response.read().decode("utf-8", errors="replace")
                      match = re.search(r"""<div[^>]*class=["'][^"']*\barticle\b[^"']*\bnew-b\b[^"']*["'][^>]*>(.*?)</div>\s*</div>""", article_html, re.S | re.I)
                      if not match:
                          match = re.search(r"""<div[^>]*class=["'][^"']*\bnew-b\b[^"']*["'][^>]*>(.*?)</div>\s*</div>""", article_html, re.S | re.I)
                      body = match.group(1) if match else ""
                      if body:
                          article["fullText"] = clean_html(body)
                          article["fullTextRu"] = translate_ru(article["fullText"])
                          found = re.findall(r"""<(?:img|source)\b[^>]*(?:src|data-src|_src)=["']([^"']+)["']""", body, re.I)
                          images = []
                          for src in found:
                              if src.startswith("//"): src = "https:" + src
                              elif src.startswith("/"): src = "https://en.moonton.com" + src
                              if src.startswith("https://") and src not in images: images.append(src)
                          if images: article["images"] = images
                          # Parse HTML events in source order so images remain between their text blocks.
                          from html.parser import HTMLParser
                          class OrderedArticleParser(HTMLParser):
                              def __init__(self):
                                  super().__init__(convert_charrefs=True)
                                  self.items = []
                                  self.active_tag = None
                                  self.text_parts = []
                              def flush_text(self):
                                  txt = clean_html(" ".join(self.text_parts))
                                  if txt:
                                      self.items.append({"type":"text","text":txt})
                                  self.text_parts = []
                              def handle_starttag(self, tag, attrs):
                                  attrs = dict(attrs)
                                  if tag == "img":
                                      self.flush_text()
                                      src = attrs.get("src") or attrs.get("data-src") or attrs.get("_src")
                                      if src:
                                          if src.startswith("//"): src = "https:" + src
                                          elif src.startswith("/"): src = "https://en.moonton.com" + src
                                          if src.startswith("https://"):
                                              self.items.append({"type":"image","src":src})
                                  elif tag in ("p","h1","h2","h3","h4","h5","h6","li","blockquote"):
                                      if self.active_tag is None:
                                          self.active_tag = tag
                                          self.text_parts = []
                              def handle_data(self, data):
                                  if self.active_tag is not None and data.strip():
                                      self.text_parts.append(data.strip())
                              def handle_endtag(self, tag):
                                  if self.active_tag == tag:
                                      self.flush_text()
                                      self.active_tag = None
                          parser = OrderedArticleParser()
                          parser.feed(body)
                          parser.flush_text()
                          ordered = []
                          seen_images = set()
                          for block in parser.items:
                              if block["type"] == "image":
                                  if block["src"] in seen_images: continue
                                  seen_images.add(block["src"])
                                  ordered.append(block)
                              else:
                                  translated = translate_ru(block["text"])
                                  if translated and (not ordered or ordered[-1].get("text") != translated):
                                      ordered.append({"type":"text","text":translated})
                          if ordered: article["contentBlocks"] = ordered
                          print("Full article", article["id"], "characters", len(article["fullText"]), "images", len(article["images"]), "ordered blocks", len(blocks_ru))
                      else: print("Article body not found:", article["id"])
                  except Exception as exc: print("Article fetch failed:", article["id"], str(exc)[:120])
              else:
                  article["fullTextRu"] = article["summaryRu"]
          # Also collect official game-update / patch articles from mobilelegends.com.
          UPDATE_URL = "https://www.mobilelegends.com/news/"
          try:
              req = Request(UPDATE_URL, headers={"User-Agent":"Mozilla/5.0 UPDATIQ-NewsBot/1.0"})
              with urlopen(req, timeout=25) as response:
                  update_page = response.read().decode("utf-8", errors="replace")
              print("Mobile Legends update page bytes:", len(update_page))
              found = {}
              for match in re.finditer(r"""(?is)<a\b[^>]*href=["']([^"']*/news/detail-\d+[^"']*)["'][^>]*>(.*?)</a>""", update_page):
                  link, fragment = match.group(1), match.group(2)
                  url = link if link.startswith("http") else "https://www.mobilelegends.com" + (link if link.startswith("/") else "/" + link)
                  url = url.split("?",1)[0]
                  context_start = max(0, match.start()-2400)
                  context_end = min(len(update_page), match.end()+2400)
                  context = update_page[context_start:context_end]
                  title = clean_html(fragment)
                  if len(title) < 5:
                      # Some cards put the title next to the linked cover instead of inside the anchor.
                      title_match = re.search(r"""(?is)<(?:h[1-6]|strong|title)[^>]*>(.*?)</(?:h[1-6]|strong|title)>""", context)
                      if title_match:
                          title = clean_html(title_match.group(1))
                  if len(title) < 5:
                      alt_match = re.search(r"""(?is)<img\b[^>]*alt=["']([^"']{5,180})["']""", context)
                      if alt_match:
                          title = html.unescape(alt_match.group(1)).strip()
                  if len(title) < 5:
                      continue
                  image_match = re.search(r"""(?is)<img\b[^>]*(?:src|data-src)=["']([^"']+)["']""", context)
                  image = image_match.group(1) if image_match else ""
                  if image.startswith("//"): image = "https:" + image
                  elif image.startswith("/"): image = "https://www.mobilelegends.com" + image
                  date_match = re.search(r"""20\d{2}[-/]\d{2}[-/]\d{2}""", context)
                  date = date_match.group(0) if date_match else ""
                  found[url] = {"id":"ml-updates-"+re.search(r"detail-(\d+)",url).group(1),"title":title,"publishedAt":date,"summary":"Официальные заметки об обновлениях и изменениях игры.","url":url,"image":image,"images":[image] if image else [],"source":"Mobile Legends","language":"en","category":"update"}
              updates = sorted(found.values(), key=lambda a:a.get("publishedAt",""), reverse=True)[:30]
              for article in updates:
                  article["titleRu"] = translate_ru(article["title"])
                  article["summaryRu"] = translate_ru(article["summary"])
                  article["fullText"] = ""
                  article["fullTextRu"] = article["summaryRu"]
              print("Mobile Legends update articles:", len(updates))
              # Keep the build safe: a blocked or redesigned source must not erase the MOONTON feed.
              if updates:
                  articles.extend(updates)
          except Exception as exc:
              print("Mobile Legends update source unavailable:", str(exc)[:180])
          previous_source = {}
          previous_patch_articles = []
          try:
              previous_data = json.loads(Path("official-news.json").read_text(encoding="utf-8"))
              previous_source = previous_data.get("source") or {}
              previous_patch_articles = [a for a in previous_data.get("articles", []) if a.get("category") == "update" and a.get("patchVersion")]
          except Exception as exc:
              print("Could not preserve previous patch notes:", str(exc)[:120])
          known_ids = {a.get("id") for a in articles}
          preserved = [a for a in previous_patch_articles if a.get("id") not in known_ids]
          articles.extend(preserved)
          print("Preserved detailed patch-note entries:", len(preserved))
          out = {"source":{"name":"MOONTON Games + Mobile Legends","url":URL,"updatesUrl":UPDATE_URL,"checkedAt":datetime.now(timezone.utc).isoformat(),"intervalMinutes":30,"patchNotesUrl":previous_source.get("patchNotesUrl","https://mlbbhub.com/patch-notes"),"patchNotesCheckedAt":previous_source.get("patchNotesCheckedAt","")}, "articles":articles}
          Path("official-news.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Collected",len(articles),"official articles")
          print("Articles with images:",sum(bool(a["image"]) for a in articles))
          PY
      - name: Restore detailed patch notes when missing
        run: |
          PATCH_COUNT=$(python3 -c 'import json; from pathlib import Path; d=json.loads(Path("official-news.json").read_text(encoding="utf-8")); print(sum(1 for a in d.get("articles", []) if a.get("category") == "update" and a.get("patchVersion")))')
          PATCH_AGE=$(python3 -c 'import json; from pathlib import Path; from datetime import datetime, timezone; d=json.loads(Path("official-news.json").read_text(encoding="utf-8")); s=d.get("source", {}).get("patchNotesCheckedAt", ""); print(max(0, int((datetime.now(timezone.utc)-datetime.fromisoformat(s.replace("Z","+00:00"))).total_seconds())) if s else 999999999)')
          echo "Patch-note cache age in seconds: $PATCH_AGE"
          echo "Cached detailed patch-note entries: $PATCH_COUNT"
          if [ "$PATCH_COUNT" -eq 0 ] || [ "$PATCH_AGE" -ge 21600 ]; then
            python3 -m pip install --quiet requests beautifulsoup4
            python3 scripts/sync_patch_notes.py
          fi
      - name: Generate live official news data script
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("official-news.json").read_text(encoding="utf-8"))
          Path("app/src/main/assets/official-news-data.js").write_text(
              "window.UPDATIQ_OFFICIAL_NEWS = " + json.dumps(data, ensure_ascii=False, separators=(",", ":")) + ";\n",
              encoding="utf-8"
          )
          print("Generated live official news script:", len(data.get("articles", [])), "articles")
          PY
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-news.json app/src/main/assets/official-news-data.js
          if git diff --cached --quiet; then echo "No news changes."; exit 0; fi
          git commit -m "Update official MOONTON news feed"
          # API commits or another workflow may update main after checkout.
          # Rebase the generated feed commit onto the latest remote before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
