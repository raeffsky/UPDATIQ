name: Sync public UPDATIQ Telegram feed
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_telegram_channel.py'
      - '.github/workflows/sync-telegram-channel.yml'
permissions:
  contents: write
concurrency:
  group: telegram-channel-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: python3 -m pip install --quiet requests beautifulsoup4
      - name: Fetch public Telegram posts
        run: |
          python3 scripts/sync_telegram_channel.py
          grep -q '"status":"ok"' app/src/main/assets/community-news.js
          grep -Eq '"articles":\[[^]]+\]' app/src/main/assets/community-news.js || {
            echo "Telegram feed returned no posts; refusing to publish an empty feed."
            exit 1
          }
      - name: Commit updated public feed
        run: |
          if git diff --quiet -- app/src/main/assets/community-news.js; then
            echo "Telegram feed is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/community-news.js
          git commit -m "Refresh public UPDATIQ Telegram feed"
          git push
